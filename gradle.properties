# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# These were current for Minecraft 26.2 at the time this was written.
# If Gradle fails to resolve one of them, generate a fresh template at
# https://fabricmc.net/develop/template/ for your exact game version and
# copy the versions it gives you over these.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.xaria.serverdiscovery

# Dependencies
fabric_api_version=0.158.0+26.2
